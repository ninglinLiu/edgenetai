[build]
  base = "."
  publish = "apps/dashboard/.next"
  # Install command: Prepare workspace (remove problematic apps, update config), then install
  # This runs BEFORE the build command
  command = "bash netlify-build.sh && cd apps/dashboard && pnpm build"
  
[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.28.1"
  ENABLE_EXPERIMENTAL_COREPACK = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
