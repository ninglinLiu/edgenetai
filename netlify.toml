[build]
  base = "."
  publish = "apps/dashboard/.next"
  # Install command: Remove problematic packages, update workspace config, then install
  # Use --no-frozen-lockfile to handle lockfile mismatches
  installCommand = "rm -rf apps/router-api apps/verifier && echo 'packages:\n  - \"apps/dashboard\"\n  - \"packages/*\"' > pnpm-workspace.yaml && pnpm install --no-frozen-lockfile"
  # Build command: Build dashboard after dependencies are installed
  command = "cd apps/dashboard && pnpm build"
  
[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.28.1"
  ENABLE_EXPERIMENTAL_COREPACK = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
